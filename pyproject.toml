[project]
name = "res1d2excel"
version = "2.0.0"
description = "Extract MIKE 1D and EPANET result files to Excel and HTML outputs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mikeio1d>=1.3.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "PySide6>=6.9.0",
    "pythonnet>=3.1.0",
    "requests>=2.34.2",
]

[project.scripts]
res1d2excel = "res1d2excel.cli:main"
res1d2excel-gui = "res1d2excel.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/res1d2excel"]
